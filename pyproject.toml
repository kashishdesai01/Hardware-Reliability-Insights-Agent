[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hria"
version = "0.1.0"
description = "Evidence-first hardware reliability analysis agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.15,<2",
  "arq>=0.26,<1",
  "fastapi>=0.115,<1",
  "numpy>=2.2,<3",
  "openai>=1.68,<3",
  "opentelemetry-api>=1.31,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.31,<2",
  "opentelemetry-instrumentation-fastapi>=0.52b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.52b0,<1",
  "opentelemetry-sdk>=1.31,<2",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "python-dateutil>=2.9,<3",
  "pyyaml>=6.0,<7",
  "redis>=5.2,<6",
  "scipy>=1.15,<2",
  # Current OTel SQLAlchemy instrumentation supports the 2.0 line.
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
hria-generate = "hria.data.generate:main"
hria-eval = "hria.evals.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["hria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: requires a seeded Postgres database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.coverage.run]
source = ["hria"]

[tool.coverage.report]
fail_under = 65
show_missing = true
