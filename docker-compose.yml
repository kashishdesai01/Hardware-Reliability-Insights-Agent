services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hria
      POSTGRES_USER: hria
      POSTGRES_PASSWORD: hria
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hria -d hria"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  seed:
    build: .
    command: ["hria-generate", "--profile", "smoke", "--seed", "4471", "--load"]
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://hria:hria@postgres:5432/hria
      REDIS_URL: redis://redis:6379/0
      PLANNER_PROVIDER: rules
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["arq", "hria.worker.WorkerSettings"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
