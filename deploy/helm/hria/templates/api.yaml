apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hria.name" . }}-api
  labels: {{- include "hria.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: hria, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: hria, app.kubernetes.io/component: api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: "/metrics" }
    spec:
      serviceAccountName: {{ include "hria.serviceAccountName" . }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["uvicorn", "hria.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: LOG_LEVEL, value: {{ .Values.logLevel | quote }} }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: DATABASE_URL } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: REDIS_URL } }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 10, periodSeconds: 20 }
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hria.name" . }}-api
  labels: {{- include "hria.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: hria, app.kubernetes.io/component: api }
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: {{ .Values.service.targetPort }} }]
