name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hria
          POSTGRES_USER: hria
          POSTGRES_PASSWORD: hria
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hria -d hria"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://hria:hria@localhost:5432/hria
      REDIS_URL: redis://localhost:6379/0
      PLANNER_PROVIDER: rules
      HRIA_RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.8.22", enable-cache: true }
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run hria-generate --profile smoke --seed 4471 --load
      - run: uv run pytest --cov=hria --cov-report=term-missing
      - run: uv run hria-eval --cases hria/evals/cases --split development
      - run: uv run hria-eval --cases hria/evals/cases --split held_out

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run build

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.10.5" }
      - run: terraform fmt -check -recursive deploy/terraform
      - uses: azure/setup-helm@v4
        with: { version: "v3.17.3" }
      - run: helm lint deploy/helm/hria -f deploy/helm/hria/values-dev.yaml
      - run: helm template hria deploy/helm/hria -f deploy/helm/hria/values-prod.yaml > /tmp/hria.yaml
